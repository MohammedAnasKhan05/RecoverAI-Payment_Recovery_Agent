services:
  # ====================================================
  # 1. RecoverAI FastAPI Backend Web Service
  # ====================================================
  - type: web
    name: recoverai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: postgresql://postgres:[PASSWORD]@db.[REF].supabase.co:5432/postgres
      - key: SUPABASE_URL
        sync: false # Set in Render Dashboard: https://[REF].supabase.co
      - key: FRONTEND_URL
        fromService:
          type: static
          name: recoverai-frontend
          property: host

  # ====================================================
  # 2. RecoverAI React Frontend Static Site
  # ====================================================
  - type: static
    name: recoverai-frontend
    rootDir: frontend/recoverai-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: recoverai-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
